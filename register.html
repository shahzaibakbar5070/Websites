<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register — Colon-Games</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Rajdhani:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="page">

    <div class="auth-page">
      <div class="auth-card">
        <div class="auth-logo">🎮 Colon<span>-Games</span></div>
        <h2>Create Account</h2>
        <p class="subtitle">Join thousands of gamers on Colon-Games</p>

        <form id="registerForm" novalidate>
          <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" placeholder="CoolGamer99" required autocomplete="username" />
          </div>
          <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="you@example.com" required autocomplete="email" />
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Min 6 characters" required autocomplete="new-password" />
          </div>
          <div class="form-group">
            <label for="confirm">Confirm Password</label>
            <input type="password" id="confirm" placeholder="Repeat your password" required autocomplete="new-password" />
          </div>
          <div class="form-error" id="regError"></div>
          <div class="form-success" id="regSuccess"></div>
          <button type="submit" class="btn btn-primary btn-block" style="margin-top:8px;">Create Account 🎮</button>
        </form>

        <div class="auth-footer">
          Already have an account? <a href="login.html">Login here</a>
        </div>
      </div>
    </div>

  </div>
  <script src="js/auth.js"></script>
  <script>
    if (Auth.isLoggedIn()) window.location.href = "index.html";

    document.getElementById("registerForm").addEventListener("submit", async function(e) {
      e.preventDefault();
      const username = document.getElementById("username").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const confirm = document.getElementById("confirm").value;
      const errorEl = document.getElementById("regError");
      const successEl = document.getElementById("regSuccess");

      errorEl.classList.remove("show");
      successEl.classList.remove("show");

      if (!username || !email || !password || !confirm) {
        errorEl.textContent = "Please fill in all fields.";
        return errorEl.classList.add("show");
      }
      if (username.length < 3) {
        errorEl.textContent = "Username must be at least 3 characters.";
        return errorEl.classList.add("show");
      }
      if (password.length < 6) {
        errorEl.textContent = "Password must be at least 6 characters.";
        return errorEl.classList.add("show");
      }
      if (password !== confirm) {
        errorEl.textContent = "Passwords do not match.";
        return errorEl.classList.add("show");
      }

      successEl.textContent = "Creating account in MongoDB...";
      successEl.classList.add("show");

      const result = await Auth.register(username, email, password);
      if (result.success) {
        successEl.textContent = result.message + " Redirecting to login...";
        successEl.classList.add("show");
        setTimeout(() => { window.location.href = "login.html"; }, 1800);
      } else {
        errorEl.textContent = result.message;
        errorEl.classList.add("show");
      }
    });
  </script>
</body>
</html>
