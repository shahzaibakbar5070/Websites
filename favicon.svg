<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#7c4dff"/>
    </linearGradient>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Background Badge -->
  <rect width="64" height="64" rx="14" fill="#0d0d14"/>
  <rect x="2" y="2" width="60" height="60" rx="12" fill="none" stroke="url(#neonGrad)" stroke-width="2.5" opacity="0.85"/>
  <!-- Corner Gaming Accents -->
  <circle cx="10" cy="10" r="2.5" fill="#00e5ff" opacity="0.9"/>
  <circle cx="54" cy="54" r="2.5" fill="#7c4dff" opacity="0.9"/>
  <!-- CG Monogram -->
  <text x="32" y="44" font-family="'Rajdhani', -apple-system, sans-serif" font-weight="900" font-size="34" fill="url(#neonGrad)" text-anchor="middle" filter="url(#glowEffect)" letter-spacing="-1">CG</text>
</svg>
