<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Colon-Games</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Rajdhani:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="page">

    <div class="auth-page">
      <div class="auth-card">
        <div class="auth-logo">🎮 Colon<span>-Games</span></div>
        <h2>Welcome Back</h2>
        <p class="subtitle">Sign in to your account to continue</p>

        <form id="loginForm" novalidate>
          <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="you@example.com" required autocomplete="email" />
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Your password" required autocomplete="current-password" />
          </div>
          <div class="form-error" id="loginError"></div>
          <div class="form-success" id="loginSuccess"></div>
          <button type="submit" class="btn btn-primary btn-block" style="margin-top:8px;">Login →</button>
        </form>

        <div class="auth-footer">
          Don't have an account? <a href="register.html">Register here</a>
        </div>
      </div>
    </div>

  </div>
  <script src="js/auth.js"></script>
  <script>
    // Redirect if already logged in
    if (Auth.isLoggedIn()) window.location.href = "index.html";

    document.getElementById("loginForm").addEventListener("submit", async function(e) {
      e.preventDefault();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const errorEl = document.getElementById("loginError");
      const successEl = document.getElementById("loginSuccess");

      if (!email || !password) {
        errorEl.textContent = "Please fill in all fields.";
        errorEl.classList.add("show");
        return;
      }

      errorEl.classList.remove("show");
      successEl.textContent = "Authenticating...";
      successEl.classList.add("show");

      const result = await Auth.login(email, password);
      if (result.success) {
        errorEl.classList.remove("show");
        successEl.textContent = `Welcome back, ${result.user.username}! Redirecting to your profile...`;
        successEl.classList.add("show");
        setTimeout(() => { window.location.href = "profile.html"; }, 1000);
      } else {
        successEl.classList.remove("show");
        errorEl.textContent = result.message;
        errorEl.classList.add("show");
      }
    });
  </script>
</body>
</html>
